[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-firm-agents"
version = "0.4.0"
description = "A buy-side investment firm simulated as a team of orchestrated LLM agents (decision-support only)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# M1.5 — free structured/qualitative data providers
data = [
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "stockstats>=0.6.2",   # technical indicators (BSD) — shared chart + agent engine
    "scipy>=1.11",         # ARIMA(1,1,1) / GARCH(1,1) maximum-likelihood forecast cones
]
# Zero-shot quantile forecasting (Google TimesFM 2.5, Apache-2.0 weights).
# Install CPU torch FIRST from the PyTorch CPU index (see README "Forecast cone"),
# then `pip install -e ".[forecast]"`. Everything degrades gracefully when absent.
forecast = [
    "timesfm[torch]>=3.0,<4",
    "numpy>=1.24",
]
# M3 — HTTP surface
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
# Second LLM backend — Databricks model serving (auth via CLI profile / OAuth, no PATs)
databricks = [
    "databricks-sdk>=0.30.0",
]
# OpenBB Platform — optional keyless market data tools (AGPLv3; local/personal use)
openbb = [
    "openbb>=4.3",
    "openbb-cboe>=1.0",   # keyless options chains (community extension)
]
# Tests + notebooks
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "plotly>=5.20",        # notebooks/ charts
    "xlrd>=2.0",           # notebooks/: reads Shiller's ie_data.xls
    # ruff's native binary is blocked by DBAG group policy; black runs in-process
    "black>=24.0",
]

[project.scripts]
investment-firm = "investment_firm.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# firm.yaml + costs.yaml are loaded at runtime via Path(__file__); ship them in wheels too.
investment_firm = ["config/*.yaml", "py.typed", "interfaces/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 'live' tests hit the real AI Playground API and spend tokens. Deselected by default.
# Run them explicitly with:  python -m pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: tests that call the real AI Playground API (spend tokens; opt-in).",
]
